network:
  version: 2
  renderer: NetworkManager

  ethernets:
    eth0:
      match:
        macaddress: "D0:50:99:C2:B1:12"
      set-name: eth0
      dhcp4: false
      dhcp6: false

  bridges:
    br0:
      interfaces:
        - eth0
      dhcp4: true
      dhcp6: true
      addresses:
        - 192.168.1.10/24
      macaddress: "D0:50:99:C2:B1:12"
